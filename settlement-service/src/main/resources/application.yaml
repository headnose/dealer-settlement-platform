spring:
  application:
    name: settlement-service
  mongodb:
    uri: mongodb://localhost:27017/settlement_db
  data:
    redis:
      host: localhost
      port: 6379
      # C2: a dead cache must never slow a request down much. Lettuce defaults (60s command timeout,
      # 10s connect timeout) would turn a Redis outage into very slow GETs. Starting values.
      timeout: 500ms
      connect-timeout: 500ms
  # Blueprint step 5: tokens from the IdP (local Keycloak realm dsp; AWS: the company IdP). Boot reads the
  # IdP's keys from issuer-uri/.well-known lazily on the first Bearer request, so the app starts without it.
  # audiences: a token issued for another API is rejected here.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/dsp
          audiences: settlement-service

server:
  port: 8082
  tomcat:
    # Needed for tomcat.threads.busy / tomcat.threads.config.max in /actuator/metrics.
    mbeanregistry:
      enabled: true

# Same as wire-service: health + metrics only, never "*" (env, beans, heapdump would be public).
# Actuator shares the API port and Tomcat's threads (known limitation).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

resilience4j:
  circuitbreaker:
    instances:
      loanService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        # Slow but successful calls also open the breaker (import load test I2: 4 s answers below the 5 s
        # read timeout never opened it, filled the import executor and turned requests into 500s).
        # Normal calls take ~5 ms; 2 s = loan-service is in trouble. Starting values.
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

clients:
  loan-service:
    base-url: http://localhost:8081
    connect-timeout: 2s
    read-timeout: 5s

# C1/C6: cache-aside for GET /api/v1/loans/{loanId}/settlements (key lsc:loan:{loanId}).
# 30m = low end of the blueprint's 30-60 min: stale settlement data is a compliance risk.
settlement-cache:
  ttl: 30m

# Blueprint "Identity Propagation": the ALB signs the user's claims (ES256) into x-amzn-oidc-data.
# Locally our own dev key pair stands in for the ALB's key (private key in .local-keys/, never committed;
# a public key is not a secret). In AWS: signer = the real ALB ARN, keys fetched by kid from the
# regional ALB public-key endpoint (not built, known limitation).
security:
  alb:
    claims-header: x-amzn-oidc-data
    signer: arn:aws:elasticloadbalancing:us-east-1:000000000000:loadbalancer/app/dsp-local/0000000000000000
    key-id: local-dev-1
    groups-claim: groups
    clock-skew: 60s
    public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEGt+XW//2wIar/EJzPL3n+m8XDCS+
      JyrT/HeANE7wPJBEnoa3OhaFSqtzAGwHq23hkUHfBhI2jJ5Wx6w1VfQV3g==