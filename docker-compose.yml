# Local infrastructure for Dealer Settlement Platform.
# Start: docker compose up -d     Stop: docker compose down
services:

  # Relational DB for wire-service (templates, submissions, recipients)
  mysql:
    image: mysql:8.4
    container_name: dsp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wire_db          # created automatically on first start
      MYSQL_USER: dsp
      MYSQL_PASSWORD: dsp
    ports:
      - "3306:3306"                    # host:container
    volumes:
      - mysql-data:/var/lib/mysql      # keeps data when the container restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 5

  # Document DB for settlement-service (one document per loan)
  mongodb:
    image: mongo:7
    container_name: dsp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Cache (settlement-service) + idempotency keys (notification-service), week 4
  redis:
    image: redis:7-alpine
    container_name: dsp-redis
    ports:
      - "6379:6379"

  # Message broker, week 3. KRaft mode = no ZooKeeper needed.
  kafka:
    image: apache/kafka:3.9.1
    container_name: dsp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = apps on your Mac (localhost:9092)
      # INTERNAL  = other containers (kafka:29092), for when services run in Docker later
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so replication factor must be 1 (production would use 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Fake SMTP server: catches emails so you can view them in a browser, week 3
  mailpit:
    image: axllent/mailpit
    container_name: dsp-mailpit
    ports:
      - "1025:1025"                    # SMTP (apps send here)
      - "8025:8025"                    # Web UI: http://localhost:8025

volumes:
  mysql-data:
  mongo-data: