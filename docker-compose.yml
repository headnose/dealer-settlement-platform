# Local infrastructure for Dealer Settlement Platform.
# Start: docker compose up -d     Stop: docker compose down
services:

  # Relational DB for wire-service (templates, submissions, recipients)
  mysql:
    image: mysql:8.4
    container_name: dsp-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: wire_db          # created automatically on first start
      MYSQL_USER: dsp
      MYSQL_PASSWORD: dsp
    ports:
      - "3306:3306"                    # host:container
    volumes:
      - mysql-data:/var/lib/mysql      # keeps data when the container restarts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      retries: 5

  # Document DB for settlement-service (one document per loan)
  mongodb:
    image: mongo:7
    container_name: dsp-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

    # Cache for settlement-service (LSC cache-aside: GET settlement detail, C6)
  redis:
    image: redis:7-alpine
    container_name: dsp-redis
    # C4: eviction is infra, not app config. maxmemory is required: without it (default 0 = no limit)
    # the policy never kicks in. 64mb is a local starting value. AWS: ElastiCache parameter group.
    # --save "": no snapshots. A cache never needs to survive a restart (MongoDB is the source of
    # truth), and a snapshot would bring back entries whose evict failed while Redis was down.
    command: [ "redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "" ]
    ports:
      - "6379:6379"

  # Idempotency keys for notification-service (BlastMail's own Redis, separate from LSC's cache)
  blastmail-redis:
    image: redis:7-alpine
    container_name: dsp-blastmail-redis
    ports:
      - "6380:6379"                    # host 6380 -> container 6379 (6379 on the host is taken by redis)

  # Message broker, week 3. KRaft mode = no ZooKeeper needed.
  kafka:
    image: apache/kafka:3.9.1
    container_name: dsp-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = apps on your Mac (localhost:9092)
      # INTERNAL  = other containers (kafka:29092), for when services run in Docker later
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker, so replication factor must be 1 (production would use 3)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  # Fake SMTP server: catches emails so you can view them in a browser, week 3
  mailpit:
    image: axllent/mailpit
    container_name: dsp-mailpit
    ports:
      - "1025:1025"                    # SMTP (apps send here)
      - "8025:8025"                    # Web UI: http://localhost:8025

  # S3-compatible object storage for wire statement attachments (replaces the planned MinIO,
  # whose community images are no longer published). The image runs `weed mini` by default:
  # master + volume + filer + S3 gateway in one process. No volume: a restart empties it (dev only).
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: dsp-seaweedfs
    environment:
      AWS_ACCESS_KEY_ID: dsp-local          # local dev credentials; setting them turns S3 auth ON
      AWS_SECRET_ACCESS_KEY: dsp-local-secret
      S3_BUCKET: wire-statements            # bucket created on startup (infra owns buckets, not the apps)
    ports:
      - "8333:8333"                    # S3 API (apps and curl talk to this)
      - "23646:23646"                  # Admin UI: http://localhost:23646

  # Local identity provider for service-to-service auth (blueprint step 5: OAuth 2.0 client credentials).
  # Stands in for the company IdP (AWS: Cognito, Okta, ...); the apps only know its issuer URL.
  # Realm (client wire-service, scope settlement.read) imported from keycloak/dsp-realm.json on startup.
  # start-dev = plain HTTP + built-in dev database: local only, never for production.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: dsp-keycloak
    command: [ "start-dev", "--import-realm" ]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin   # admin console, local dev only
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8180:8080"                    # token endpoint + admin UI: http://localhost:8180

  # Load tests only: TCP proxy that injects latency between a service and its dependencies
  # (wire-service -> MySQL / settlement-service, settlement-service -> loan-service).
  # Not started by a plain `docker compose up -d` (profile); start with `docker compose up -d toxiproxy`.
  # Proxies come from load-test/toxiproxy.json with NO latency; toxics are added/removed via the API.
  # Docker Hub's shopify/toxiproxy is deprecated: images are on GitHub Container Registry.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    container_name: dsp-toxiproxy
    profiles: ["load-test"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./load-test/toxiproxy.json:/config/toxiproxy.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the Mac, where settlement-service and loan-service run
    depends_on:
      - mysql
    ports:
      - "8474:8474"                    # Toxiproxy API (add/remove toxics)
      - "13306:13306"                  # -> mysql:3306
      - "18082:18082"                  # -> settlement-service on the Mac (8082)
      - "18081:18081"                  # -> loan-service on the Mac (8081)

  # O1 (blueprint "Monitoring"): metrics store. Scrapes /actuator/prometheus of the services running on
  # the Mac every 5 s (job names = service names; targets in observability/prometheus/prometheus.yml).
  # Profile: not started by a plain `docker compose up -d`; start with
  # `docker compose --profile observability up -d` (or `docker compose up -d prometheus`).
  # No volume: `down` empties it (local only). 3.13 = LTS line (fixes until 31 Jul 2027).
  prometheus:
    image: prom/prometheus:v3.13.5
    container_name: dsp-prometheus
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"   # the Mac, where the services run
    ports:
      - "9090:9090"                    # UI + query API: http://localhost:9090

  # O1: dashboards on top of Prometheus (same profile). Data source and dashboards are provisioned from
  # observability/grafana/provisioning (read-only, in git), so a fresh container needs no clicking.
  # admin/admin = local dev only (like Keycloak). No volume: UI changes are lost on `down`; edit the files.
  grafana:
    image: grafana/grafana:13.3.1
    container_name: dsp-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"                    # UI: http://localhost:3000

volumes:
  mysql-data:
  mongo-data: