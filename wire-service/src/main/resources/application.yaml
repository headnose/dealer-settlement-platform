spring:
  application:
    name: wire-service
  datasource:
    url: jdbc:mysql://localhost:3306/wire_db
    username: dsp
    password: dsp
    hikari:
      data-source-properties:
        # P6: Connector/J sends a JDBC batch as ONE multi-row INSERT (without this, a batch is still
        # one round trip per row). Set here, not in the URL: the URL is overridden for proxy runs.
        rewriteBatchedStatements: true
        # P6: trust the driver's own record of autocommit/read-only (kept up to date via the JDBC API)
        # instead of asking the server "SELECT @@session.transaction_read_only" before every batch.
        # Safe because nothing here changes session state with raw SQL (SET ... statements).
        useLocalSessionState: true
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks they match your entities
    open-in-view: false     # don't keep DB connections open during the web response
    properties:
      hibernate:
        jdbc:
          batch_size: 20    # P6: batch same-table INSERTs (works because IDs are assigned in Java, not IDENTITY)
        order_inserts: true # P6: group INSERTs by entity so the 4 recipients form one batch
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000          # max wait for broker metadata before send() gives up (default 60s)
        request.timeout.ms: 5000    # max wait for one broker response
        delivery.timeout.ms: 10000  # total time incl. retries; must be >= linger.ms + request.timeout.ms
        spring.json.add.type.headers: false   # JSON is the contract, not PWT's Java class names

    consumer:
      auto-offset-reset: earliest   # a NEW consumer group starts at the beginning, so no early events are skipped

server:
  port: 8083
  tomcat:
    mbeanregistry:
      enabled: true   # exposes tomcat.threads.busy / .config.max for the timeout load test

clients:
  settlement-service:
    base-url: http://localhost:8082
    connect-timeout: 2s   # time to open the TCP connection
    read-timeout: 5s      # time to wait for the response once connected

topics:
  partitions: 6
  replication-factor: 1   # blueprint: >= 3 in production; a single local broker only supports 1

# B4: circuit breaker on the settlement-service call (same starting values as settlement-service's
# loanService breaker, L3). Only "settlement-service unavailable" counts as a failure (timeout, connection
# error, 5xx, empty body); the two business 404s count as successful calls. Starting values: tune with the
# load test.
resilience4j:
  circuitbreaker:
    instances:
      settlementService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - io.github.headnose.dsp.wire.client.SettlementServiceUnavailableException

# Wire statement attachments (D21-D24). Local = SeaweedFS from docker compose.
storage:
  endpoint: http://localhost:8333     # SeaweedFS; leave empty for real AWS S3
  region: us-east-1                   # SeaweedFS ignores it, but the SDK requires one
  access-key: dsp-local               # local dev only; leave empty in AWS to use the IAM role
  secret-key: dsp-local-secret
  bucket: wire-statements
  path-style-access: true             # localhost:8333/wire-statements/key (no per-bucket DNS locally)
  api-call-attempt-timeout: 2s        # one HTTP attempt
  api-call-timeout: 5s                # whole call incl. SDK retries (starting values, check in load test)

# Actuator: health + metrics only (load test: Hikari pool, server and repository timings).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics   # never "*": env/configprops/heapdump would expose secrets