spring:
  application:
    name: wire-service
    # O3 (LG4): restore registered ThreadLocals (trace + our MDC keys, MdcPropagationConfig) on every thread a
    # Reactor chain runs on: the WebClient call to settlement-service hops to boundedElastic (token fetch) and
    # Reactor Netty threads. Boot's default "limited" restores them only in a few operators (handle/tap).
  reactor:
    context-propagation: auto
  datasource:
    url: jdbc:mysql://localhost:3306/wire_db
    username: dsp
    password: dsp
    hikari:
      data-source-properties:
        # P6: Connector/J sends a JDBC batch as ONE multi-row INSERT (without this, a batch is still
        # one round trip per row). Set here, not in the URL: the URL is overridden for proxy runs.
        rewriteBatchedStatements: true
        # P6: trust the driver's own record of autocommit/read-only (kept up to date via the JDBC API)
        # instead of asking the server "SELECT @@session.transaction_read_only" before every batch.
        # Safe because nothing here changes session state with raw SQL (SET ... statements).
        useLocalSessionState: true
  jpa:
    hibernate:
      ddl-auto: validate    # Flyway creates tables; Hibernate only checks they match your entities
    open-in-view: false     # don't keep DB connections open during the web response
    properties:
      hibernate:
        jdbc:
          batch_size: 20    # P6: batch same-table INSERTs (works because IDs are assigned in Java, not IDENTITY)
        order_inserts: true # P6: group INSERTs by entity so the 4 recipients form one batch
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        enable.idempotence: true
        max.block.ms: 5000          # max wait for broker metadata before send() gives up (default 60s)
        request.timeout.ms: 5000    # max wait for one broker response
        delivery.timeout.ms: 10000  # total time incl. retries; must be >= linger.ms + request.timeout.ms
        spring.json.add.type.headers: false   # JSON is the contract, not PWT's Java class names

    consumer:
      auto-offset-reset: earliest   # a NEW consumer group starts at the beginning, so no early events are skipped
    # O2 (G2): Spring Kafka observations (off by default). Producer: one span per send + traceparent header on
    # the record. Listener: one span per received record that continues the trace from that header.
    # Only Boot's KafkaTemplate and listener factory; the hand-built DLQ template is not observed.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  # Blueprint step 5: wire-service's own credential for settlement-service (OAuth2 client credentials).
  # token-uri instead of issuer-uri: issuer-uri makes Boot contact the IdP at startup; token-uri is only
  # used on the first call, so the app and all tests start without Keycloak.
  # The secret comes from the environment in AWS (Secrets Manager -> ECS); the default is local dev only.
  security:
    oauth2:
      client:
        registration:
          settlement-service:
            provider: dsp
            client-id: wire-service
            client-secret: ${WIRE_SERVICE_CLIENT_SECRET:wire-service-local-secret}
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            scope: settlement.read
        provider:
          dsp:
            token-uri: http://localhost:8180/realms/dsp/protocol/openid-connect/token
server:
  port: 8083
  tomcat:
    mbeanregistry:
      enabled: true   # exposes tomcat.threads.busy / .config.max for the timeout load test

clients:
  settlement-service:
    base-url: http://localhost:8082
    connect-timeout: 2s   # time to open the TCP connection
    read-timeout: 5s      # time to wait for the response once connected

topics:
  partitions: 6
  replication-factor: 1   # blueprint: >= 3 in production; a single local broker only supports 1

# B4: circuit breaker on the settlement-service call (same starting values as settlement-service's
# loanService breaker, L3). Only "settlement-service unavailable" counts as a failure (timeout, connection
# error, 5xx, empty body); the two business 404s count as successful calls. Starting values: tune with the
# load test.
resilience4j:
  circuitbreaker:
    instances:
      settlementService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        record-exceptions:
          - io.github.headnose.dsp.wire.client.SettlementServiceUnavailableException
        # S7: IdP down or token refused is not settlement-service's fault: neither failure nor success.
        ignore-exceptions:
          - io.github.headnose.dsp.wire.client.ServiceAuthenticationUnavailableException

# Wire statement attachments (D21-D24). Local = SeaweedFS from docker compose.
storage:
  endpoint: http://localhost:8333     # SeaweedFS; leave empty for real AWS S3
  region: us-east-1                   # SeaweedFS ignores it, but the SDK requires one
  access-key: dsp-local               # local dev only; leave empty in AWS to use the IAM role
  secret-key: dsp-local-secret
  bucket: wire-statements
  path-style-access: true             # localhost:8333/wire-statements/key (no per-bucket DNS locally)
  api-call-attempt-timeout: 2s        # one HTTP attempt
  api-call-timeout: 5s                # whole call incl. SDK retries (starting values, check in load test)

# Actuator: health, metrics (load tests) and prometheus (O1: scraped by the local Prometheus).
# Actuator: health, metrics (load tests) and prometheus (O1: scraped by the local Prometheus).
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus   # never "*": env/configprops/heapdump would expose secrets
  # O1: publish histogram buckets so Prometheus/Grafana can compute p50/p95/p99 across scrapes
  # (blueprint "Monitoring": request latency p50/p95/p99). Micrometer's MAX alone cannot do that.
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        http.client.requests: true   # the settlement-service call (WebClient)
  # O2 (G4): trace every request locally (Boot default 0.1). Production would sample less.
  tracing:
    sampling:
      probability: 1.0
  # O2: export spans over OTLP/HTTP to the local Jaeger (no default endpoint in Boot 4.1).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  # O2: the OpenTelemetry starter also brings Micrometer's OTLP metrics registry (enabled by default,
  # pushes to localhost:4318 = Jaeger). Metrics are already pulled by Prometheus: turn the push off.
  otlp:
    metrics:
      export:
        enabled: false
# Blueprint "Identity Propagation": same ALB (path-based routing) in front of LSC and PWT, so the same
# signer and key as settlement-service. Locally our dev key pair stands in for the ALB's key (private key in
# .local-keys/, never committed; a public key is not a secret). In AWS: keys fetched by kid (not built).
security:
  alb:
    claims-header: x-amzn-oidc-data
    signer: arn:aws:elasticloadbalancing:us-east-1:000000000000:loadbalancer/app/dsp-local/0000000000000000
    key-id: local-dev-1
    groups-claim: groups
    clock-skew: 60s
    public-key: MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEGt+XW//2wIar/EJzPL3n+m8XDCS+
      JyrT/HeANE7wPJBEnoa3OhaFSqtzAGwHq23hkUHfBhI2jJ5Wx6w1VfQV3g==
# O3 (LG1): people read the console (plain text, unchanged); machines read this file (ECS JSON, one event
# per line, the field names Elasticsearch/Kibana expect). In AWS the container sets
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs instead, because ECS/Fargate collects stdout.
# Relative path: lands under the directory the app was started from (git-ignored).
logging:
  file:
    name: logs/${spring.application.name}.json
  structured:
    format:
      file: ecs