# Basic UI (compose profile "ui"): serves ui/index.html and proxies the API calls, so the browser talks to one
# origin (http://localhost:8090) and needs no CORS settings in the services. Same idea as the ALB routing by path.
# The services are reached through the host's published ports, so this works whether they run in the "apps"
# profile or from the IDE.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # /loan/api/v1/... -> loan-service /api/v1/...
    location /loan/ {
        proxy_pass http://host.docker.internal:8081/;
    }
    # /lsc/api/v1/... -> settlement-service
    location /lsc/ {
        proxy_pass http://host.docker.internal:8082/;
    }
    # /pwt/api/v1/... -> wire-service
    location /pwt/ {
        proxy_pass http://host.docker.internal:8083/;
    }
}
