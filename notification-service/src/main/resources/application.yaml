spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: blastmail                # all BlastMail instances share one group: each event handled by one instance
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer   # raw JSON, parsed in code (B1)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
        spring.json.add.type.headers: false
    # O2 (G2): Spring Kafka observations (off by default). Listener: one span per received email-delivery record,
    # continuing PWT's trace from the traceparent header. Producer: one span per delivery-status send.
    # Only Boot's KafkaTemplate and listener factory; the hand-built DLQ template is not observed.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
  data:
    redis:
      host: localhost
      port: 6380                         # blastmail-redis, not LSC's redis on 6379
  mail:
    host: localhost
    port: 1025                           # Mailpit SMTP

server:
  port: 8084

# O1: health + prometheus only (no security in BlastMail: it has no user-facing API). Never "*".
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  # O2 (G4): trace every request/record locally (Boot default 0.1). Production would sample less.
  tracing:
    sampling:
      probability: 1.0
  # O2: export spans over OTLP/HTTP to the local Jaeger (no default endpoint in Boot 4.1).
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
  # O2: the OpenTelemetry starter also brings Micrometer's OTLP metrics registry (enabled by default,
  # pushes to localhost:4318 = Jaeger). Metrics are already pulled by Prometheus: turn the push off.
  otlp:
    metrics:
      export:
        enabled: false
topics:
  partitions: 6
  replication-factor: 1                  # 1 locally, blueprint >= 3
  min-insync-replicas: 1  # 1 locally (one broker); production 2 with replication factor 3

blastmail:
  from: blastmail@example.com
  idempotency:
    processing-ttl: 5m                   # a crashed attempt blocks retries at most this long
    sent-ttl: 30d                        # = DLQ retention, so replaying a DLQ event cannot email twice


    # Wire statement attachments (D25, D26). Local = SeaweedFS from docker compose.
storage:
  endpoint: http://localhost:8333        # SeaweedFS; leave empty for real AWS S3
  region: us-east-1                      # SeaweedFS ignores it, but the SDK requires one
  access-key: dsp-local                  # local dev only; in AWS use a READ-ONLY IAM role for BlastMail
  secret-key: dsp-local-secret
  bucket: wire-statements                # the ONLY bucket BlastMail will read; other s3:// paths are rejected
  path-style-access: true                # localhost:8333/wire-statements/key (no per-bucket DNS locally)
  api-call-attempt-timeout: 2s           # one HTTP attempt
  api-call-timeout: 5s                   # whole call incl. SDK retries (starting values, check in load test)

# O3 (LG1): people read the console (plain text, unchanged); machines read this file (ECS JSON, one event
# per line, the field names Elasticsearch/Kibana expect). In AWS the container sets
# LOGGING_STRUCTURED_FORMAT_CONSOLE=ecs instead, because ECS/Fargate collects stdout.
# Relative path: lands under the directory the app was started from (git-ignored).
logging:
  file:
    name: logs/${spring.application.name}.json
  structured:
    format:
      file: ecs