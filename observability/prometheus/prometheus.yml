# O1: Prometheus scrape config (local). Prometheus PULLS: every scrape_interval it GETs each target's
# /actuator/prometheus. The services run on the Mac, Prometheus in Docker, so targets use
# host.docker.internal (same as Toxiproxy). A stopped service shows as up == 0, not as an error.
global:
  scrape_interval: 5s        # local: fine-grained enough for 60 s k6 runs (default 1m; 15-30s is common in prod)
  evaluation_interval: 5s

scrape_configs:
  - job_name: settlement-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]

  - job_name: wire-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
